<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Forage Berkeley — wild plant flash cards</title>
  <meta name="description" content="A swipeable flash-card field guide to forageable wild plants of Berkeley and the East Bay. A learning aid, not a safety authority." />
  <meta name="theme-color" content="#f7f3ec" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Forage Berkeley — wild plant flash cards" />
  <meta property="og:description" content="Swipe through forageable wild plants of Berkeley & the East Bay. Tap a card to flip: what is this? then the answer. A learning aid, not a safety authority." />
  <meta property="og:image" content="og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Forage Berkeley — wild plant flash cards" />
  <meta name="twitter:image" content="og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f7f3ec;
      --card: #fffdf9;
      --ink: #2b2118;
      --ink-soft: #7b6c57;
      --rust: #a8421f;
      --rust-deep: #7d2f14;
      --sage: #5e6b43;
      --amber: #b9791b;
      --line: #e6dccb;
      --serif: "Fraunces", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--serif);
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }

    .app {
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 14px 16px calc(12px + env(safe-area-inset-bottom));
    }

    /* ---- Top bar ---- */
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .brand { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
    .brand span { color: var(--ink-soft); font-weight: 400; font-size: 13px; }
    .progress-num { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }

    .bar { height: 3px; background: var(--line); border-radius: 2px; margin: 9px 0 12px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--sage); width: 0; transition: width 0.25s ease; }

    /* ---- Filter ---- */
    .filters { display: flex; gap: 6px; margin-bottom: 12px; }
    .chip {
      flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em;
      padding: 7px 4px; border-radius: 999px; border: 1px solid var(--line);
      background: transparent; color: var(--ink-soft); cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    /* ---- Card stage ---- */
    .stage { position: relative; flex: 1; min-height: 0; display: flex; }
    .card {
      position: relative; flex: 1; display: flex; flex-direction: column;
      background: var(--card); border: 1px solid var(--line);
      border-left: 5px solid var(--accent, var(--ink-soft));
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(43,33,24,.05), 0 14px 34px rgba(43,33,24,.10);
      cursor: pointer; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      will-change: transform;
    }
    .card.anim { transition: transform 0.32s cubic-bezier(.22,.61,.36,1), opacity 0.32s; }
    .card[data-edibility="edible"] { --accent: var(--sage); }
    .card[data-edibility="care"]   { --accent: var(--amber); }
    .card[data-edibility="no"]     { --accent: var(--rust); }

    .face { flex: 1; min-height: 0; display: none; flex-direction: column; }
    .card:not(.flipped) .front { display: flex; }
    .card.flipped .back { display: flex; }

    /* Front */
    .front { padding: 16px 16px 14px; }
    .front-top {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-soft); margin-bottom: 12px;
    }
    .front-top .hint { color: var(--accent, var(--ink-soft)); }
    .hero {
      position: relative; flex: 1; min-height: 0; border-radius: 14px; overflow: hidden;
      background: #efe7d8; border: 1px solid var(--line);
    }
    .hero img, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slotcap {
      position: absolute; left: 8px; bottom: 8px; font-family: var(--mono); font-size: 9.5px;
      letter-spacing: 0.12em; text-transform: uppercase; color: #fff;
      background: rgba(43,33,24,.55); padding: 3px 7px; border-radius: 6px; backdrop-filter: blur(2px);
    }
    .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; height: 92px; flex: 0 0 auto; }
    .thumb { position: relative; border-radius: 12px; overflow: hidden; background: #efe7d8; border: 1px solid var(--line); }
    .ph {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-soft);
      background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(43,33,24,.04) 8px, rgba(43,33,24,.04) 16px), #efe7d8;
    }
    img.ok + .ph { display: none; }

    /* Back */
    .back { padding: 16px 16px 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .badges { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
    .badge {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 4px 9px; border-radius: 999px; border: 1px solid currentColor; color: var(--ink-soft);
    }
    .badge.edibility { color: #fff; border: none; }
    .card[data-edibility="edible"] .badge.edibility { background: var(--sage); }
    .card[data-edibility="care"]   .badge.edibility { background: var(--amber); }
    .card[data-edibility="no"]     .badge.edibility { background: var(--rust); }
    .back h2 { font-weight: 600; font-size: 24px; line-height: 1.08; margin: 0 0 2px; }
    .back .sci { font-style: italic; font-size: 15px; color: var(--ink-soft); margin: 0 0 13px; }
    .row { margin: 0 0 10px; font-size: 14.5px; line-height: 1.45; }
    .row .lab {
      display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px;
    }
    .row.watch { padding: 9px 11px; border-radius: 9px; background: rgba(168,66,31,.06); border: 1px solid rgba(168,66,31,.22); }
    .row.watch .lab { color: var(--rust); }
    .card[data-edibility="no"] .row.watch { background: rgba(168,66,31,.10); border-color: var(--rust); }
    .story { margin: 12px 0 2px; font-style: italic; font-size: 13.5px; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 11px; }
    .flip-hint { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-top: 10px; }

    /* ---- Controls ---- */
    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }
    .nav {
      width: 46px; height: 46px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); color: var(--ink); font-size: 19px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(43,33,24,.06); transition: transform 0.1s, border-color 0.15s;
    }
    .nav:active { transform: scale(0.92); }
    .nav.flip { width: auto; padding: 0 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; height: 46px; }
    .nav.small { width: 40px; height: 40px; font-size: 15px; }

    .foot { text-align: center; margin-top: 10px; font-size: 11px; color: var(--ink-soft); line-height: 1.5; }
    .foot a { color: var(--rust-deep); }
    .foot .swipe-hint { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; }

    .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-style: italic; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">Forage Berkeley <span>· East Bay</span></div>
      <div class="progress-num" id="pnum">–</div>
    </div>
    <div class="bar"><i id="pbar"></i></div>

    <nav class="filters" aria-label="Filter by edibility">
      <button class="chip" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" data-filter="edible" aria-pressed="false">Edible</button>
      <button class="chip" data-filter="care" aria-pressed="false">Care</button>
      <button class="chip" data-filter="no" aria-pressed="false">Don't eat</button>
    </nav>

    <div class="stage" id="stage">
      <div class="empty">Loading the Berkeley deck…</div>
    </div>

    <div class="controls">
      <button class="nav small" id="shuffle" title="Shuffle (S)" aria-label="Shuffle deck">⤮</button>
      <button class="nav" id="prev" title="Previous (←)" aria-label="Previous card">‹</button>
      <button class="nav flip" id="flip" aria-label="Flip card">Flip</button>
      <button class="nav" id="next" title="Next (→)" aria-label="Next card">›</button>
      <button class="nav small" id="info" title="Disclaimer" aria-label="Safety disclaimer">i</button>
    </div>

    <p class="foot">
      <span class="swipe-hint">Swipe right · next &nbsp;|&nbsp; tap · flip</span><br>
      A learning aid, not a safety guide. Never eat anything ID'd from this app alone.
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
